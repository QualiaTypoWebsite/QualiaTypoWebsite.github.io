name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v5 of these actions runs natively on the runner's Node 24; v4 targets
      # Node 20, which the runner now force-migrates while printing a
      # deprecation warning on every run.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Renders page images at deploy time instead of committing them. Ubuntu's
      # `imagemagick` package is ImageMagick 6 (the `convert`/`identify`
      # binaries, no `magick`); scripts/build-pages.mjs handles either major
      # version.
      - name: Install PDF tooling
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick

      - run: npm ci

      - name: Render magazine pages
        run: npm run pages

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
